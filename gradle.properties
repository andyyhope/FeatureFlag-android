GROUP=com.andyyhope.featureflag
VERSION_NAME=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Build independent module tasks in parallel.
org.gradle.parallel=true
# Cache the configuration phase so repeat invocations skip re-configuring every module.
org.gradle.configuration-cache=true
kotlin.code.style=official
# The Android modules' test dependencies (AndroidX Test) are AndroidX artifacts.
android.useAndroidX=true
# KSP 2.2.10-2.0.2 adds its generated sources through the kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin forbids unless this is false. Every Android module that applies ksp needs it
# (samples/host, docs-samples). Gradle prints a one-line "experimental option" warning for it.
android.disallowKotlinSourceSets=false
# The sample host's application id, in one place: the host's applicationId and namespace, the
# sample companion's <uses-permission> placeholder and its BuildConfig.HOST_PACKAGE.
featureflag.sample.hostId=com.andyyhope.featureflag.sample.host
